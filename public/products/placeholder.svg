  <g transform="translate(300 270)" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <circle r="60"/>
    <path d="M-54 0 L54 0 M0 -54 L0 54"/>
    <circle r="22" fill="#1e293b"/>
  </g>
  <g font-family="ui-sans-serif,system-ui,Inter,sans-serif" text-anchor="middle" fill="#94a3b8">
    <text x="300" y="430" font-size="22" letter-spacing="3" font-weight="600">PRODUCT PHOTO</text>
    <text x="300" y="460" font-size="14" letter-spacing="1" opacity="0.7">600 × 600 placeholder</text>
    <text x="300" y="484" font-size="11" letter-spacing="1" opacity="0.5" font-family="ui-monospace,Consolas,monospace">/products/placeholder.svg</text>
  </g>
</svg>
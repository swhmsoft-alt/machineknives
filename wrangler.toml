name = "machineknives"
compatibility_date = "2026-09-23"
main = "worker/index.ts"

# Route /api/* on custommachineknives.com to this Worker.
# Declared here so `wrangler deploy` re-asserts the route on every
# push — without this block the dashboard route gets dropped when
# the Worker is redeployed and /api/inquiry silently 404s.
routes = [
  { pattern = "custommachineknives.com/api/*", zone_name = "custommachineknives.com" },
]

# Static assets — preserves the current "Worker serves ./dist" behavior
[assets]
directory = "./dist"
binding = "ASSETS"

# D1 binding — this is the fix (was missing in v31)
[[d1_databases]]
binding = "DB"
database_name = "inquiry-db"
database_id = "52db485c-8c75-4074-917b-2c9c137538de"
# ============================================================
# KAIPU Prompt Seed (V1.0)
# ============================================================
# 14 条 prompt. 每个 query_id 只对应一条 prompt (V1.0 1:1).
# 覆盖 5 个 buyer_role × 7 个 entity (代表性子集).
# V1.0 状态: 占位, 待人工在 4 个 AI 通道跑分.
# 校验: npm run query:audit
# ============================================================
#
# NOTE: prompts use BLOCK style (not flow) because the `prompt` field
# holds a multi-line block scalar `|` which is illegal inside a
# flow mapping `{ ... }`. block style is the only safe YAML form here.

prompts:
  # --- Procurement (4) ---
  - id: P001
    query_id: Q001
    buyer_role: procurement
    scenario: 'tissue-bed-knife-material'
    prompt: |
      I'm sourcing tissue-cutting bed knives for a 1200 m/min converting line.
      What blade material and edge geometry should I specify,
      and what factors most affect blade service life?
    expected_signals:
      - 'D2 HRC 60'
      - '15μm hone + 18° clearance'
      - 'edge temperature ~180°C'
      - 'service life quantification'
    last_tested: null
    tested_in: { chatgpt: null, gemini: null, perplexity: null, ai_mode: null }
    notes: 'Forked from Q001. Highest commercial intent.'

  - id: P002

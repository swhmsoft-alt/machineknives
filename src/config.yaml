site:
  name: Industrial Knives
  site: 'https://industrial-knives.net'
  base: '/'
  trailingSlash: true

  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: Industrial Knives — Precision Engineered Machine Knives
    template: '%s — Industrial Knives'
  description: "Manufacturer of industrial machine knives for printing, packaging, converting, food processing and recycling. OEM and custom solutions. Engineering-grade D2, HSS and carbide blades."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Industrial Knives
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: ''
    site: ''
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      # URL scheme: /blog/<category>/<slug>/. The %category% token is substituted
      # by src/utils/blog.ts → generatePermalink(). Each post MUST declare a
      # `category:` in its frontmatter (enforced at build time).
      permalink: '/blog/%category%/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      # Categories now live under /blog/<category>/, mirroring the post permalink
      # above. getPermalink(slug, 'category') therefore produces /blog/<slug>/.
      pathname: 'blog'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
